<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07120d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outage Money">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Outage Money</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="nav-button" data-open="hoursDialog">Hours</button>
      <button class="nav-button" data-open="planDialog">Plan</button>
      <button class="nav-button" data-open="spendDialog">Spend</button>
    </header>

    <section class="home-card" aria-live="polite">
      <div class="eyebrow">Outage Money</div>
      <div id="completionRing" class="completion-ring" style="--progress:0deg">
        <div class="ring-inner">
          <div id="total" class="total">£0.00</div>
          <div id="progressText" class="progress-text">0% complete</div>
        </div>
      </div>
      <div id="earningStatus" class="earning-status">NOT EARNING</div>
      <div id="countdown" class="countdown">Loading schedule…</div>
      <div id="syncStatus" class="sync-status" data-state="loading">● Connecting…</div>
    </section>
    <p id="globalError" class="global-error" hidden></p>
  </main>

  <dialog id="hoursDialog" class="sheet">
    <div class="sheet-head"><h2>Hours</h2><button class="icon-close" data-close="hoursDialog" aria-label="Close">×</button></div>
    <label class="field"><span>Date</span><input id="hoursDate" type="date"></label>
    <div id="hoursList" class="stack"></div>
    <form id="hoursForm" class="form-card">
      <input id="periodId" type="hidden">
      <div class="form-grid">
        <label class="field"><span>Start</span><input id="periodStart" type="time" required></label>
        <label class="field"><span>Finish</span><input id="periodEnd" type="time" required></label>
      </div>
      <label class="field"><span>Rate</span><select id="periodMultiplier"><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <p id="hoursError" class="inline-error" hidden></p>
      <button class="primary" type="submit">Save overtime</button>
      <button id="cancelHoursEdit" class="secondary" type="button" hidden>Cancel edit</button>
    </form>
  </dialog>

  <dialog id="planDialog" class="sheet large-sheet">
    <div class="sheet-head"><h2>Plan</h2><button class="icon-close" data-close="planDialog" aria-label="Close">×</button></div>
    <nav class="tabs" aria-label="Plan sections">
      <button class="tab active" data-tab="forecastPanel">Forecast</button>
      <button class="tab" data-tab="calendarPanel">Calendar</button>
      <button class="tab" data-tab="funPanel">Fun</button>
    </nav>

    <section id="forecastPanel" class="tab-panel active">
      <label class="field"><span>Future date</span><input id="futureDate" type="date"></label>
      <div id="forecastCards" class="metric-grid"></div>
    </section>

    <section id="calendarPanel" class="tab-panel">
      <div class="calendar-head">
        <button id="prevMonth" class="secondary compact" type="button">‹</button>
        <strong id="calendarTitle"></strong>
        <button id="nextMonth" class="secondary compact" type="button">›</button>
      </div>
      <div class="weekday-row"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="calendarDayDetail" class="calendar-detail"></div>
    </section>

    <section id="funPanel" class="tab-panel">
      <div id="bossCard"></div>
      <div id="levelCard" class="fun-card"></div>
      <div class="fun-card"><h3>Milestones</h3><div id="milestoneList" class="stack tight"></div></div>
      <div class="fun-card"><h3>Achievements</h3><div id="achievementGrid" class="badge-grid"></div></div>
      <div id="comparisonCard" class="fun-card"></div>
    </section>
  </dialog>

  <dialog id="spendDialog" class="sheet">
    <div class="sheet-head"><h2>Spend</h2><button class="icon-close" data-close="spendDialog" aria-label="Close">×</button></div>
    <form id="spendForm" class="form-card">
      <input id="expenseId" type="hidden">
      <label class="field"><span>Description</span><input id="expenseDescription" maxlength="160" required placeholder="Holiday"></label>
      <div class="form-grid">
        <label class="field"><span>Amount</span><input id="expenseAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>
        <label class="field"><span>Date</span><input id="expenseDate" type="date" required></label>
      </div>
      <p id="spendError" class="inline-error" hidden></p>
      <button class="primary" type="submit">Save expenditure</button>
      <button id="cancelSpendEdit" class="secondary" type="button" hidden>Cancel edit</button>
    </form>
    <div id="spendList" class="stack"></div>
  </dialog>

  <div id="effectRoot" class="effect-root" aria-live="assertive"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
